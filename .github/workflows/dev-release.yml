name: Dev release

# Dev-сборка (flavor dev — все виджеты, включая экспериментальные) собирается
# по тегу вида v1.4-dev и публикуется как GitHub Release с подписанным APK
# (пометка prerelease). Подпись — debug-ключом из keystore/debug.keystore,
# как и у prod-релиза (см. .github/workflows/prod-release.yml).

on:
  push:
    tags:
      - 'v*-dev'

permissions:
  contents: write

jobs:
  dev-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDevDebugUnitTest :app:testProdDebugUnitTest

      - name: Build dev release APK
        run: ./gradlew :app:assembleDevRelease

      - name: Release notes from CHANGELOG.md
        run: |
          ver="${GITHUB_REF_NAME#v}"; ver="${ver%-dev}"
          awk -v v="$ver" '/^\[/{f=0} /^## \[/{f=index($0,"## ["v"]")==1; next} f' CHANGELOG.md > release-notes.md
          cat release-notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/dev/release/*.apk
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: true
