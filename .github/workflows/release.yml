name: Release

# Единая сборка приложения: тег v* запускает юнит-тесты, собирает подписанный
# релизный APK и публикует GitHub Release. Суффикс -dev у тега (например
# v1.5-dev) остаётся допустимым и публикуется как prerelease. Подпись —
# debug-ключом из keystore/debug.keystore (см. app/build.gradle.kts),
# поэтому локальная и CI-сборки взаимозаменяемы и обновляются поверх
# установленной.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      - name: Release notes from CHANGELOG.md
        run: |
          ver="${GITHUB_REF_NAME#v}"; ver="${ver%-dev}"
          awk -v v="$ver" '/^\[/{f=0} /^## \[/{f=index($0,"## ["v"]")==1; next} f' CHANGELOG.md > release-notes.md
          cat release-notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-dev') }}
