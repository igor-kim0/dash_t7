name: "Telegram: анонс релиза"

# Вызывается из Release после успешной сборки (workflow_call) либо вручную:
# Actions → «Telegram: анонс релиза» → Run workflow → тег (например v1.8.1).

on:
  workflow_call:
    inputs:
      tag:
        description: Тег релиза (v1.8.1)
        required: true
        type: string
      dry_run:
        description: Только показать текст
        required: false
        type: boolean
        default: false
      no_apk:
        description: Не прикреплять APK
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: Тег релиза (v1.8.1)
        required: true
      dry_run:
        description: Только показать текст, не публиковать
        type: boolean
        default: false
      no_apk:
        description: Не прикреплять APK
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: telegram-post-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHANNEL_ID: ${{ vars.TG_CHANNEL_ID || '@tenet_t7_dash' }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Проверить, что секрет задан
        id: check
        run: |
          if [ -z "$TG_BOT_TOKEN" ]; then
            echo "::warning::Секрет TG_BOT_TOKEN не задан — анонс пропущен"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      # Скрипт бота берём из основной ветки: в старых тегах (v1.8 и раньше)
      # tools/telegram ещё нет. CHANGELOG — из тега, если там есть раздел
      # этой версии, иначе из основной ветки.
      - name: Checkout основной ветки
        if: steps.check.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: CHANGELOG из тега
        if: steps.check.outputs.enabled == 'true'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          ver="${TAG#v}"; ver="${ver%-dev}"
          cp CHANGELOG.md "$RUNNER_TEMP/CHANGELOG.md"
          if git fetch --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG" \
             && git show "$TAG:CHANGELOG.md" > "$RUNNER_TEMP/CHANGELOG.tag.md" \
             && grep -q "^## \[$ver\]" "$RUNNER_TEMP/CHANGELOG.tag.md"; then
            mv "$RUNNER_TEMP/CHANGELOG.tag.md" "$RUNNER_TEMP/CHANGELOG.md"
            echo "CHANGELOG из тега $TAG"
          else
            echo "::notice::В теге $TAG нет раздела [$ver] — CHANGELOG из основной ветки"
          fi

      - name: Опубликовать
        if: steps.check.outputs.enabled == 'true'
        run: |
          args=(post-release --tag "${{ inputs.tag }}" --changelog "$RUNNER_TEMP/CHANGELOG.md")
          if [ "${{ inputs.dry_run }}" = "true" ]; then args+=(--dry-run); fi
          if [ "${{ inputs.no_apk }}" = "true" ]; then args+=(--no-apk); fi
          python3 tools/telegram/bot.py "${args[@]}"
