name: "Telegram: отложенные посты"

# Публикует посты из content/telegram/queue, у которых наступил publish_at,
# и переносит их в content/telegram/sent (коммитом).
#
# Cron GitHub для такого репозитория срабатывает раз в несколько часов, поэтому
# на него не полагаемся: job `wait` сам спит до ближайшего publish_at (не больше
# 5,5 ч — лимит job 6 ч), потом `publish` публикует и, если в очереди ещё есть
# посты, перезапускает workflow (chain=true) ждать следующий.
# Push нового поста или cron отменяют текущее ожидание и пересчитывают время.
# Cron оставлен как страховка, если цепочка оборвётся.

on:
  push:
    branches: [master]
    paths: ['content/telegram/queue/**']
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Только показать, что было бы опубликовано
        type: boolean
        default: false
      chain:
        description: Служебное — перезапуск цепочкой (ждать только будущие посты)
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  wait:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    concurrency:
      group: telegram-queue-wait
      cancel-in-progress: true
    outputs:
      due: ${{ steps.wait.outputs.due }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ждать ближайший пост
        id: wait
        run: |
          args=(queue-wait)
          # Цепочка ждёт только будущие посты: просроченный пост, который не
          # удалось отправить, иначе перезапускал бы workflow без конца.
          if [ "${{ github.event.inputs.chain }}" = "true" ]; then args+=(--future-only); fi
          out=$(python3 tools/telegram/bot.py "${args[@]}")
          echo "$out"
          wait=${out#wait=}
          if [ "$wait" = "none" ]; then
            echo "Очередь пуста"
            echo "due=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            wait=0
          elif [ "$wait" -gt 0 ]; then
            wait=$((wait + 5))
          fi
          if [ "$wait" -gt 19800 ]; then wait=19800; fi
          echo "Сплю $wait с (до $(date -u -d "+$wait seconds" '+%F %T UTC'))"
          sleep "$wait"
          echo "due=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: wait
    if: needs.wait.outputs.due == 'true'
    runs-on: ubuntu-latest
    # Не отменять: прерывание между отправкой и коммитом приведёт к повторному посту.
    concurrency:
      group: telegram-queue-publish
      cancel-in-progress: false
    env:
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHANNEL_ID: ${{ vars.TG_CHANNEL_ID || '@tenet_t7_dash' }}
    steps:
      - name: Проверить, что секрет задан
        id: check
        run: |
          if [ -z "$TG_BOT_TOKEN" ]; then
            echo "::warning::Секрет TG_BOT_TOKEN не задан — очередь пропущена"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.check.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Опубликовать созревшее
        if: steps.check.outputs.enabled == 'true'
        run: |
          args=(run-queue)
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then args+=(--dry-run); fi
          python3 tools/telegram/bot.py "${args[@]}"

      - name: Закоммитить перенесённые посты
        if: steps.check.outputs.enabled == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/telegram
          if git diff --cached --quiet; then
            echo "Новых публикаций нет"
            exit 0
          fi
          git commit -m "Telegram: опубликован отложенный пост [skip ci]"
          # Если ветку успели обновить, повторяем с rebase, чтобы не потерять
          # отметку об отправке (иначе пост уйдёт повторно).
          for i in 1 2 3; do
            git pull --rebase --autostash || true
            if git push; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Не удалось закоммитить отметку об отправке — проверьте защиту ветки"
          exit 1

      - name: Ждать следующий пост (перезапуск цепочкой)
        if: steps.check.outputs.enabled == 'true' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=$(python3 tools/telegram/bot.py queue-wait --future-only)
          echo "$out"
          if [ "$out" = "wait=none" ]; then
            echo "Будущих постов нет — цепочка завершена"
            exit 0
          fi
          gh workflow run telegram-queue.yml --ref master -f chain=true
